<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro rápido · RallyHub</title>
<link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="brand"><img src="/static/assets/logo.svg" alt=""><span>RallyHub</span></div>
    <h1>Registro rápido</h1>
    <p class="muted">Crea tu cuenta de estudiante para reservar mesas e inscribirte a clases.</p>
    <div id="msg" role="alert" aria-live="assertive"></div>
    <form id="form" novalidate>
      <div class="field-row">
        <div class="field"><label for="first_name">Nombre</label>
          <input id="first_name" name="first_name" autocomplete="given-name" maxlength="80" required></div>
        <div class="field"><label for="last_name">Apellidos</label>
          <input id="last_name" name="last_name" autocomplete="family-name" maxlength="80" required></div>
      </div>
      <div class="field"><label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      <div class="field"><label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="pw-help">
        <small id="pw-help" class="help">Mínimo 10 caracteres, con letras y números.</small></div>
      <div class="field"><label for="password2">Confirmar contraseña</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="128" required></div>
      <button class="btn primary" type="submit" id="go">Crear cuenta</button>
    </form>
    <p class="login-alt">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
  </main>
</div>
<script type="module" src="/static/js/registro.js"></script>
</body>
</html>
