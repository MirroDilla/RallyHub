<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · RallyHub</title>
<link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="brand"><img src="/static/assets/logo.svg" alt=""><span>RallyHub</span></div>
    <h1>Iniciar sesión</h1>
    <p class="muted">Gestión para clubes y academias de tenis de mesa.</p>
    <div id="msg" role="alert" aria-live="assertive"></div>
    <form id="form" novalidate>
      <div class="field"><label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit" id="go">Entrar</button>
    </form>
    <div class="login-alt">
      <span>¿Eres estudiante nuevo?</span>
      <a class="btn" href="/registro" id="register">Registro rápido</a>
    </div>
  </main>
</div>
<script type="module" src="/static/js/login.js"></script>
</body>
</html>
